# ZsirafVision v4.7.1 – Cloudflare Worker (proxy + hibajelentő + stats)
name = "zsirafvision-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# Hibajelentések tárolása. Az id-t a `npx wrangler kv namespace create REPORTS`
# parancs kiírja – azt kell ide bemásolni.
[[kv_namespaces]]
binding = "REPORTS"
id = "ee953f0a6caf4a67aa5a8f35c0db7f18"

# v4.5: 10 percenként felébreszti a Render proxyt
[triggers]
crons = ["*/10 * * * *"]

# v4.6: élő nézőszámláló – Durable Object (SQLite osztály = ingyenes csomagban elérhető)
[[durable_objects.bindings]]
name = "VIEWERS"
class_name = "ViewerCounter"

[[migrations]]
tag = "v4.6-viewers"
new_sqlite_classes = ["ViewerCounter"]

# v4.7: tartalék proxyk (prioritás: kisebb = előbb; azonos prioritáson körbeforgatás)
# Új backend: add hozzá ide, majd `npx wrangler deploy`. Mindegyiken ugyanaz a RENDER_SIGN_KEY kell!
[vars]
PROXY_BACKENDS = '[{"name":"render","url":"https://zsirafvision-proxy2.onrender.com","priority":1},{"name":"back4app","url":"https://zsirafvisionproxy-tblpw161.back4.app","priority":1},{"name":"deno","url":"https://zsirafvision-proxy.zsirafvision.deno.net","priority":1}]'
